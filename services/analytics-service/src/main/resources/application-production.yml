# Production profile: every value comes from the environment, nothing has a fallback.
spring:
  datasource:
    url: jdbc:oracle:thin:@//${DB_HOST}:${DB_PORT}/${DB_SERVICE}
    username: ${ANALYTICS_DB_USERNAME}
    password: ${ANALYTICS_DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      connection-init-sql: ALTER SESSION SET CURRENT_SCHEMA = ${ANALYTICS_DB_SCHEMA}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER}

analytics:
  oltp-schema: ${OLTP_SCHEMA}

security:
  allowed-origins: ${ANALYTICS_ALLOWED_ORIGINS}

logging:
  level:
    edu.yildiz.ecommerce: WARN
    root: WARN
