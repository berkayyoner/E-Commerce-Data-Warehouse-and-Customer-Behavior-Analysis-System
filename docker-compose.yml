# Local infrastructure: Oracle, Redis and Elasticsearch.
# Copy .env.example to .env and set the passwords before running `docker compose up -d`.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: dwh-oracle-db
    logging: *default-logging
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?set ORACLE_PASSWORD in .env}
      APP_USER: dwh_oltp
      APP_USER_PASSWORD: ${OLTP_PASSWORD:?set OLTP_PASSWORD in .env}
      OLAP_PASSWORD: ${OLAP_PASSWORD:?set OLAP_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      READER_PASSWORD: ${READER_PASSWORD:?set READER_PASSWORD in .env}
    ports:
      - "${DB_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./database/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dwh-redis
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    container_name: dwh-elasticsearch
    logging: *default-logging
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # Versioned database scripts: `docker compose --profile migrate run --rm flyway-olap` (or flyway-app).
  # Another Flyway command can be appended, for example `flyway-olap info`.
  flyway-olap:
    image: flyway/flyway:11
    container_name: dwh-flyway-olap
    profiles: ["migrate"]
    depends_on:
      oracle-db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:oracle:thin:@//oracle-db:1521/FREEPDB1
      FLYWAY_USER: dwh_olap
      FLYWAY_PASSWORD: ${OLAP_PASSWORD:?set OLAP_PASSWORD in .env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
    command: migrate
    volumes:
      - ./database/migrations/olap:/flyway/sql:ro

  flyway-app:
    image: flyway/flyway:11
    container_name: dwh-flyway-app
    profiles: ["migrate"]
    depends_on:
      oracle-db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:oracle:thin:@//oracle-db:1521/FREEPDB1
      FLYWAY_USER: dwh_app
      FLYWAY_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
    command: migrate
    volumes:
      - ./database/migrations/app:/flyway/sql:ro

  # Optional single entry point (routes by path). Start with `docker compose --profile gateway up -d gateway`.
  gateway:
    image: nginx:1.27-alpine
    container_name: dwh-gateway
    profiles: ["gateway"]
    logging: *default-logging
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./deploy/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # The whole system in containers: `docker compose --profile apps up -d --build`.
  # host.docker.internal is the address of the auth server for both the browser and the containers, so the token
  # issuer is the same everywhere. This is a local setup; real environments use their own host names.
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    image: dwh/auth-service
    container_name: dwh-auth-service
    profiles: ["apps"]
    logging: *default-logging
    depends_on:
      oracle-db:
        condition: service_healthy
    environment:
      DB_HOST: oracle-db
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      AUTH_ISSUER: http://host.docker.internal:9000
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-}
      AUTH_ETL_CLIENT_SECRET: ${AUTH_ETL_CLIENT_SECRET:-}
    ports:
      - "9000:9000"
    restart: unless-stopped

  etl-service:
    build:
      context: .
      dockerfile: services/etl-service/Dockerfile
    image: dwh/etl-service
    container_name: dwh-etl-service
    profiles: ["apps"]
    logging: *default-logging
    depends_on:
      oracle-db:
        condition: service_healthy
    environment:
      DB_HOST: oracle-db
      OLAP_PASSWORD: ${OLAP_PASSWORD}
      AUTH_ISSUER: http://host.docker.internal:9000
    ports:
      - "8081:8081"
    restart: unless-stopped

  shop-service:
    build:
      context: .
      dockerfile: services/shop-service/Dockerfile
    image: dwh/shop-service
    container_name: dwh-shop-service
    profiles: ["apps"]
    logging: *default-logging
    depends_on:
      oracle-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      DB_HOST: oracle-db
      OLTP_DB_PASSWORD: ${OLTP_PASSWORD}
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      AUTH_ISSUER: http://host.docker.internal:9000
    ports:
      - "8082:8082"
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    image: dwh/analytics-service
    container_name: dwh-analytics-service
    profiles: ["apps"]
    logging: *default-logging
    depends_on:
      oracle-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DB_HOST: oracle-db
      REDIS_HOST: redis
      ANALYTICS_DB_PASSWORD: ${READER_PASSWORD}
      AUTH_ISSUER: http://host.docker.internal:9000
    ports:
      - "8083:8083"
    restart: unless-stopped

  segmentation-service:
    build:
      context: .
      dockerfile: services/segmentation-service/Dockerfile
    image: dwh/segmentation-service
    container_name: dwh-segmentation-service
    profiles: ["apps"]
    logging: *default-logging
    depends_on:
      oracle-db:
        condition: service_healthy
    environment:
      DB_HOST: oracle-db
      OLAP_PASSWORD: ${OLAP_PASSWORD}
      AUTH_ISSUER: http://host.docker.internal:9000
    ports:
      - "8084:8084"
    restart: unless-stopped

  dwh-admin-web:
    build:
      context: web/dwh-admin-web
    image: dwh/dwh-admin-web
    container_name: dwh-admin-web
    profiles: ["apps"]
    logging: *default-logging
    ports:
      - "3001:80"
    restart: unless-stopped

  analytics-portal-web:
    build:
      context: web/analytics-portal-web
    image: dwh/analytics-portal-web
    container_name: dwh-analytics-portal-web
    profiles: ["apps"]
    logging: *default-logging
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  oracle-data:
  redis-data:
  elasticsearch-data:
