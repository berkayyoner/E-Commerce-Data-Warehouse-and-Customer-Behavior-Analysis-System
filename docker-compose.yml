# The whole system with one command: `docker compose up --build`.
# Passwords have local defaults; copy .env.example to .env to choose your own.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: dwh-oracle-db
    logging: *default-logging
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-OracleLocal2026}
      APP_USER: dwh_oltp
      APP_USER_PASSWORD: ${OLTP_PASSWORD:-OltpLocal2026}
      OLAP_PASSWORD: ${OLAP_PASSWORD:-OlapLocal2026}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-AppLocal2026}
      READER_PASSWORD: ${READER_PASSWORD:-ReaderLocal2026}
    ports:
      - "${DB_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./database/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dwh-redis
    logging: *default-logging
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    container_name: dwh-elasticsearch
    logging: *default-logging
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # Versioned database scripts. They run to completion on every start; applied versions are skipped.
  # Another Flyway command can be run by hand, for example `docker compose run --rm flyway-olap info`.
  flyway-olap:
    image: flyway/flyway:11
    container_name: dwh-flyway-olap
    depends_on:
      oracle-db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:oracle:thin:@//oracle-db:1521/FREEPDB1
      FLYWAY_USER: dwh_olap
      FLYWAY_PASSWORD: ${OLAP_PASSWORD:-OlapLocal2026}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
    restart: "no"
    command: migrate
    volumes:
      - ./database/migrations/olap:/flyway/sql:ro

  flyway-app:
    image: flyway/flyway:11
    container_name: dwh-flyway-app
    depends_on:
      oracle-db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:oracle:thin:@//oracle-db:1521/FREEPDB1
      FLYWAY_USER: dwh_app
      FLYWAY_PASSWORD: ${APP_DB_PASSWORD:-AppLocal2026}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
    restart: "no"
    command: migrate
    volumes:
      - ./database/migrations/app:/flyway/sql:ro

  # Fills the OLTP schema once (BenchBase TPC-C load, workload and enrichment). Later starts skip it.
  oltp-seed:
    build:
      context: database
      dockerfile: seed/Dockerfile
    image: dwh/oltp-seed
    container_name: dwh-oltp-seed
    logging: *default-logging
    depends_on:
      oracle-db:
        condition: service_healthy
    environment:
      DB_HOST: oracle-db
      OLTP_PASSWORD: ${OLTP_PASSWORD:-OltpLocal2026}
      SCALE_FACTOR: ${SCALE_FACTOR:-10}
      WORKLOAD_SECONDS: ${WORKLOAD_SECONDS:-120}
    restart: "no"

  # Optional single entry point (routes by path). Start with `docker compose --profile gateway up -d gateway`.
  gateway:
    image: nginx:1.27-alpine
    container_name: dwh-gateway
    profiles: ["gateway"]
    logging: *default-logging
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./deploy/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  # The services and the React applications.
  # host.docker.internal is the address of the auth server for both the browser and the containers, so the token
  # issuer is the same everywhere. This is a local setup; real environments use their own host names.
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    image: dwh/auth-service
    container_name: dwh-auth-service
    logging: *default-logging
    depends_on:
      oracle-db:
        condition: service_healthy
      flyway-app:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: oracle-db
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-AppLocal2026}
      AUTH_ISSUER: http://host.docker.internal:9000
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD:-Admin-Local-2026}
      AUTH_ETL_CLIENT_SECRET: ${AUTH_ETL_CLIENT_SECRET:-etl-local-secret-2026}
    ports:
      - "9000:9000"
    restart: unless-stopped

  etl-service:
    build:
      context: .
      dockerfile: services/etl-service/Dockerfile
    image: dwh/etl-service
    container_name: dwh-etl-service
    logging: *default-logging
    depends_on:
      oracle-db:
        condition: service_healthy
      flyway-olap:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: oracle-db
      OLAP_PASSWORD: ${OLAP_PASSWORD:-OlapLocal2026}
      AUTH_ISSUER: http://host.docker.internal:9000
    ports:
      - "8081:8081"
    restart: unless-stopped

  shop-service:
    build:
      context: .
      dockerfile: services/shop-service/Dockerfile
    image: dwh/shop-service
    container_name: dwh-shop-service
    logging: *default-logging
    depends_on:
      oracle-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      oltp-seed:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: oracle-db
      OLTP_DB_PASSWORD: ${OLTP_PASSWORD:-OltpLocal2026}
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      AUTH_ISSUER: http://host.docker.internal:9000
    ports:
      - "8082:8082"
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    image: dwh/analytics-service
    container_name: dwh-analytics-service
    logging: *default-logging
    depends_on:
      oracle-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      flyway-olap:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: oracle-db
      REDIS_HOST: redis
      ANALYTICS_DB_PASSWORD: ${READER_PASSWORD:-ReaderLocal2026}
      AUTH_ISSUER: http://host.docker.internal:9000
    ports:
      - "8083:8083"
    restart: unless-stopped

  segmentation-service:
    build:
      context: .
      dockerfile: services/segmentation-service/Dockerfile
    image: dwh/segmentation-service
    container_name: dwh-segmentation-service
    logging: *default-logging
    depends_on:
      oracle-db:
        condition: service_healthy
      flyway-olap:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_HOST: oracle-db
      OLAP_PASSWORD: ${OLAP_PASSWORD:-OlapLocal2026}
      AUTH_ISSUER: http://host.docker.internal:9000
    ports:
      - "8084:8084"
    restart: unless-stopped

  dwh-admin-web:
    build:
      context: web/dwh-admin-web
    image: dwh/dwh-admin-web
    container_name: dwh-admin-web
    logging: *default-logging
    ports:
      - "3001:80"
    restart: unless-stopped

  analytics-portal-web:
    build:
      context: web/analytics-portal-web
    image: dwh/analytics-portal-web
    container_name: dwh-analytics-portal-web
    logging: *default-logging
    ports:
      - "3000:80"
    restart: unless-stopped

  # Builds the warehouse and the customer segments once the services are up. It ends when both are done;
  # the applications are usable meanwhile, the reports fill when the ETL run has finished.
  bootstrap:
    build:
      context: deploy/bootstrap
    image: dwh/bootstrap
    container_name: dwh-bootstrap
    logging: *default-logging
    depends_on:
      auth-service:
        condition: service_healthy
      etl-service:
        condition: service_healthy
      segmentation-service:
        condition: service_healthy
      oltp-seed:
        condition: service_completed_successfully
    environment:
      AUTH_ETL_CLIENT_SECRET: ${AUTH_ETL_CLIENT_SECRET:-etl-local-secret-2026}
    restart: "no"

volumes:
  oracle-data:
  redis-data:
  elasticsearch-data:
