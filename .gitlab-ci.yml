# Pipeline: test everything, build the images, migrate the database and deploy.
# Development is deployed automatically from the default branch, production by a manual approval of the same
# images. The needed CI/CD variables are listed in deploy/README.md.

stages:
  - test
  - package
  - migrate
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  IMAGE_PREFIX: "$CI_REGISTRY_IMAGE"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/

backend-test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn -B verify
  artifacts:
    when: always
    reports:
      junit: services/*/target/surefire-reports/TEST-*.xml

web-test:
  stage: test
  image: node:22
  parallel:
    matrix:
      - APP: [dwh-admin-web, analytics-portal-web]
  script:
    - cd web/$APP
    - npm install --no-audit --no-fund
    - CI=true npm test -- --watchAll=false
    - CI=true npm run build
  cache:
    key: "web-$APP"
    paths:
      - web/$APP/node_modules/

database-migrations-check:
  stage: test
  image:
    name: flyway/flyway:11
    entrypoint: [""]
  script:
    # Flyway reads and validates the scripts without a database: the file names must follow V<number>__<name>.sql.
    - ls database/migrations/olap database/migrations/app
    - |
      for file in database/migrations/*/V*.sql; do
        case "$(basename "$file")" in
          V[0-9]*__*.sql) ;;
          *) echo "Bad migration name: $file"; exit 1 ;;
        esac
      done
  rules:
    - changes:
        - database/migrations/**/*

# One job per image, built and pushed with Kaniko so no Docker daemon is needed on the runner.
.image-job: &image-job
  stage: package
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"$CI_REGISTRY\":{\"auth\":\"$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

image:auth-service:
  <<: *image-job
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile services/auth-service/Dockerfile --destination "$IMAGE_PREFIX/auth-service:$CI_COMMIT_SHORT_SHA"

image:etl-service:
  <<: *image-job
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile services/etl-service/Dockerfile --destination "$IMAGE_PREFIX/etl-service:$CI_COMMIT_SHORT_SHA"

image:shop-service:
  <<: *image-job
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile services/shop-service/Dockerfile --destination "$IMAGE_PREFIX/shop-service:$CI_COMMIT_SHORT_SHA"

image:analytics-service:
  <<: *image-job
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile services/analytics-service/Dockerfile --destination "$IMAGE_PREFIX/analytics-service:$CI_COMMIT_SHORT_SHA"

image:segmentation-service:
  <<: *image-job
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile services/segmentation-service/Dockerfile --destination "$IMAGE_PREFIX/segmentation-service:$CI_COMMIT_SHORT_SHA"

image:dwh-admin-web:
  <<: *image-job
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR/web/dwh-admin-web" --dockerfile "$CI_PROJECT_DIR/web/dwh-admin-web/Dockerfile" --destination "$IMAGE_PREFIX/dwh-admin-web:$CI_COMMIT_SHORT_SHA"

image:analytics-portal-web:
  <<: *image-job
  script:
    - /kaniko/executor --context "$CI_PROJECT_DIR/web/analytics-portal-web" --dockerfile "$CI_PROJECT_DIR/web/analytics-portal-web/Dockerfile" --destination "$IMAGE_PREFIX/analytics-portal-web:$CI_COMMIT_SHORT_SHA"

# Database migrations run before the new version is deployed, with the same scripts the services were tested with.
.migrate: &migrate
  stage: migrate
  image:
    name: flyway/flyway:11
    entrypoint: [""]
  script:
    - flyway -url="jdbc:oracle:thin:@//$DB_HOST:$DB_PORT/$DB_SERVICE" -user=dwh_olap -password="$OLAP_PASSWORD" -locations=filesystem:database/migrations/olap -connectRetries=5 migrate
    - flyway -url="jdbc:oracle:thin:@//$DB_HOST:$DB_PORT/$DB_SERVICE" -user=dwh_app -password="$APP_DB_PASSWORD" -locations=filesystem:database/migrations/app -connectRetries=5 migrate

migrate:development:
  <<: *migrate
  environment:
    name: development
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

migrate:production:
  <<: *migrate
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual

# Renders the overlay of the environment, points every image at the commit that was built and applies it.
.deploy: &deploy
  stage: deploy
  image:
    name: bitnami/kubectl:1.31
    entrypoint: [""]
  script:
    - export KUBECONFIG="$KUBE_CONFIG"
    - cd deploy/k8s/overlays/$ENVIRONMENT
    - kubectl kustomize . | sed "s#registry.example.com/dwh/\([a-z-]*\):[a-z]*#$IMAGE_PREFIX/\1:$CI_COMMIT_SHORT_SHA#" | kubectl apply -f -
    - |
      for name in auth-service etl-service shop-service analytics-service segmentation-service dwh-admin-web analytics-portal-web; do
        kubectl -n "dwh-$ENVIRONMENT" rollout status deployment/$name --timeout=300s
      done

deploy:development:
  <<: *deploy
  variables:
    ENVIRONMENT: development
  environment:
    name: development
    url: https://admin.dev.dwh.example.com
  needs:
    - migrate:development
    - job: image:auth-service
    - job: image:etl-service
    - job: image:shop-service
    - job: image:analytics-service
    - job: image:segmentation-service
    - job: image:dwh-admin-web
    - job: image:analytics-portal-web
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:production:
  <<: *deploy
  variables:
    ENVIRONMENT: production
  environment:
    name: production
    url: https://admin.dwh.example.com
  needs:
    - migrate:production
    - deploy:development
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
