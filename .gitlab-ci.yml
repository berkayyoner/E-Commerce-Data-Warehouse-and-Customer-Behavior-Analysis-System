stages:
  - test
  - build

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository/
    - web/**/node_modules/

backend-test:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn -B verify
  rules:
    - exists:
        - pom.xml

web-test:
  stage: test
  image: node:22
  parallel:
    matrix:
      - APP: [dwh-admin-web, analytics-portal-web]
  script:
    - cd web/$APP
    - npm ci
    - CI=true npm test -- --watchAll=false
  rules:
    - exists:
        - web/*/package.json

backend-package:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn -B -DskipTests package
  artifacts:
    paths:
      - services/*/target/*.jar
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists:
        - pom.xml
