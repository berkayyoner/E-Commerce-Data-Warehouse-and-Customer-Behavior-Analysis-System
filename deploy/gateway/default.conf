# API gateway: one address for the React applications, routed to the services behind it.
# Tokens are validated by each service, the gateway only routes, limits request size and adds timeouts.

# Docker's internal DNS. Names are resolved when a request arrives, so the gateway starts even if a service is down.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    client_max_body_size 1m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Authorization server: sign in page, OAuth 2.0 endpoints, discovery document and the user API.
    location ~ ^/(oauth2|login|logout|connect|\.well-known|userinfo|api/auth)(/|$) {
        set $auth_upstream http://auth-service:9000;
        proxy_pass $auth_upstream;
    }

    location /api/etl/ {
        set $etl_upstream http://etl-service:8081;
        proxy_pass $etl_upstream;
        # A run request answers at once, but run details can take a moment while the job is writing.
        proxy_read_timeout 120s;
    }

    location /api/shop/ {
        set $shop_upstream http://shop-service:8082;
        proxy_pass $shop_upstream;
    }

    location /api/analytics/ {
        set $analytics_upstream http://analytics-service:8083;
        proxy_pass $analytics_upstream;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }
}
