# Template of the secret that the services read. It is NOT part of the kustomization: create the real secret from
# the CI/CD variables or a secret manager and never commit it.
#
#   kubectl -n dwh-development create secret generic dwh-secrets \
#       --from-literal=APP_DB_PASSWORD=... --from-literal=OLAP_PASSWORD=... (and so on)
#
# The same variables for kubectl apply (values are base64 encoded or written under stringData):
apiVersion: v1
kind: Secret
metadata:
  name: dwh-secrets
type: Opaque
stringData:
  APP_DB_PASSWORD: change-me          # dwh_app, user table of the auth service
  OLAP_PASSWORD: change-me            # dwh_olap, ETL and segmentation services
  OLTP_DB_PASSWORD: change-me         # dwh_oltp, shop service
  ANALYTICS_DB_PASSWORD: change-me    # dwh_reader, report API (read only)
  REDIS_PASSWORD: ""                  # empty when Redis has no password
  AUTH_ETL_CLIENT_SECRET: change-me   # secret of the etl-scheduler client used by the nightly job
  AUTH_ADMIN_PASSWORD: change-me      # first administrator, used only while the user table is empty
  AUTH_JWT_PRIVATE_KEY: change-me     # base64 PKCS8 RSA private key that signs the tokens
  AUTH_JWT_PUBLIC_KEY: change-me      # base64 X509 RSA public key
