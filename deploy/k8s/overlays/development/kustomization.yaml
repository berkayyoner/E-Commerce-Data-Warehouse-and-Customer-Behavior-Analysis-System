# Development: one replica of everything, the `development` Spring profile and the development host names.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dwh-development
resources:
  - ../../base
  - ../../infrastructure
images:
  - name: ghcr.io/your-github-user/dwh/auth-service
    newTag: development
  - name: ghcr.io/your-github-user/dwh/etl-service
    newTag: development
  - name: ghcr.io/your-github-user/dwh/shop-service
    newTag: development
  - name: ghcr.io/your-github-user/dwh/analytics-service
    newTag: development
  - name: ghcr.io/your-github-user/dwh/segmentation-service
    newTag: development
  - name: ghcr.io/your-github-user/dwh/dwh-web
    newTag: development
patches:
  - target:
      kind: ConfigMap
      name: dwh-config
    patch: |-
      - op: replace
        path: /data/SPRING_PROFILES_ACTIVE
        value: development
      - op: replace
        path: /data/DB_HOST
        value: oracle.dev.example.com
      - op: replace
        path: /data/AUTH_ISSUER
        value: https://api.dev.dwh.example.com
      - op: replace
        path: /data/AUTH_ALLOWED_ORIGINS
        value: https://dwh.dev.example.com
      - op: replace
        path: /data/ETL_ALLOWED_ORIGINS
        value: https://dwh.dev.example.com
      - op: replace
        path: /data/SHOP_ALLOWED_ORIGINS
        value: https://dwh.dev.example.com
      - op: replace
        path: /data/ANALYTICS_ALLOWED_ORIGINS
        value: https://dwh.dev.example.com
      - op: replace
        path: /data/SEGMENTATION_ALLOWED_ORIGINS
        value: https://dwh.dev.example.com
  - target:
      kind: ConfigMap
      name: dwh-web-config
    patch: |-
      - op: replace
        path: /data/GATEWAY_URL
        value: https://api.dev.dwh.example.com
  - target:
      kind: Ingress
      name: dwh
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts
        value: [dwh.dev.example.com, api.dev.dwh.example.com]
      - op: replace
        path: /spec/rules/0/host
        value: dwh.dev.example.com
      - op: replace
        path: /spec/rules/1/host
        value: api.dev.dwh.example.com
  # One replica is enough while developing, so the autoscalers keep to a single pod.
  - target:
      kind: HorizontalPodAutoscaler
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
