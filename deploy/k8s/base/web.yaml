apiVersion: apps/v1
kind: Deployment
metadata:
  name: dwh-web
  labels:
    app.kubernetes.io/name: dwh-web
    app.kubernetes.io/part-of: shop-data-warehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dwh-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dwh-web
        app.kubernetes.io/part-of: shop-data-warehouse
    spec:
      containers:
        - name: dwh-web
          image: ghcr.io/your-github-user/dwh/dwh-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: dwh-web-config
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dwh-web
  labels:
    app.kubernetes.io/name: dwh-web
spec:
  selector:
    app.kubernetes.io/name: dwh-web
  ports:
    - name: http
      port: 80
      targetPort: http
